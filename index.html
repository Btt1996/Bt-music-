<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Btt Music — Personal Offline Music Player</title>
    <meta name="description" content="Btt Music: Personal offline music player for iPhone with Btt Smart Mix, Telegram music synchronization, persistent IndexedDB audio storage, and lock-screen audio playback." />
    <meta property="og:title" content="Btt Music — Personal Offline Music Player" />
    <meta property="og:description" content="Btt Music: Personal offline music player for iPhone with Btt Smart Mix, Telegram music synchronization, persistent IndexedDB audio storage, and lock-screen audio playback." />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- iOS PWA & Standalone Web App configuration (respecting notch & Dynamic Island) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Btt Music" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- System-based theme-color for iOS status bar & Safari chrome -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Instant System Settings Theme Detector (Prevents Flash of Wrong Theme) -->
    <script>
      (function() {
        function applySystemTheme() {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        }
        applySystemTheme();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
        }
      })();
    </script>

    <!-- Official Btt Music App Logo for Apple Home Screen & Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="icon" type="image/png" href="/app-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Refreshing Modern Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white dark:bg-black text-black dark:text-white antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black overflow-x-hidden font-['Outfit',-apple-system,BlinkMacSystemFont,'SF_Pro_Display','Segoe_UI',Roboto,sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
